<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>🐱 Кот-ходилка с 3D кубиком</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
  * { 
    margin: 0; 
    padding: 0; 
    box-sizing: border-box; 
  }
  
  html, body {
    width: 100%;
    min-height: 100vh;
    overflow-x: hidden;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
  }

  body {
    font-family: 'Nunito', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    position: relative;
    touch-action: pan-y;
    padding-bottom: 20px;
  }

  .game-container {
    position: relative;
    width: 100%;
    min-height: 100vh;
    max-width: 1600px;
    margin: 0 auto;
    padding: 10px;
  }

  /* ==================== СТАРТОВЫЙ ПОПАП ==================== */
  .start-popup-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.8);
    backdrop-filter: blur(10px);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 2000;
    animation: fadeIn 0.5s;
    overflow-y: auto;
    padding: 20px;
  }

  .start-popup-overlay.hidden {
    display: none;
  }

  .start-popup {
    background: linear-gradient(135deg, #ffffff 0%, #f5f5f5 100%);
    border-radius: 30px;
    padding: 40px;
    max-width: 600px;
    width: 100%;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
    animation: popIn 0.6s cubic-bezier(0.68, -0.55, 0.265, 1.55);
    position: relative;
    overflow: hidden;
    font-family: 'Nunito', sans-serif;
  }

  .start-popup::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 8px;
    background: linear-gradient(90deg, #4CAF50, #FFD700, #FF6B6B, #4CAF50);
    background-size: 200% 100%;
    animation: rainbow 3s linear infinite;
  }

  @keyframes rainbow {
    0% { background-position: 0% 50%; }
    100% { background-position: 200% 50%; }
  }

  .popup-cat-image {
    width: 150px;
    height: 150px;
    margin: 0 auto 20px;
    display: block;
    animation: bounce 2s infinite;
  }

  .popup-cat-image img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    filter: drop-shadow(0 8px 16px rgba(0,0,0,0.2));
  }

  .popup-title {
    text-align: center;
    font-size: 32px;
    font-weight: 900;
    color: #333;
    margin-bottom: 25px;
    text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
    font-family: 'Nunito', sans-serif;
  }

  .popup-title span {
    color: #4CAF50;
  }

  .popup-rules {
    background: linear-gradient(135deg, #e3f2fd 0%, #bbdefb 100%);
    border-radius: 20px;
    padding: 25px;
    margin-bottom: 30px;
    border-left: 6px solid #4CAF50;
    font-family: 'Nunito', sans-serif;
  }

  .popup-rules h3 {
    color: #1976d2;
    font-size: 20px;
    font-weight: 800;
    margin-bottom: 15px;
    display: flex;
    align-items: center;
    gap: 10px;
    font-family: 'Nunito', sans-serif;
  }

  .popup-rules p {
    color: #333;
    font-size: 16px;
    font-weight: 600;
    line-height: 1.6;
    margin-bottom: 12px;
    font-family: 'Nunito', sans-serif;
  }

  .popup-rules p:last-child {
    margin-bottom: 0;
  }

  .popup-rules em {
    color: #555;
    font-style: italic;
    font-weight: 600;
    display: block;
    margin-top: 10px;
    padding-top: 10px;
    border-top: 2px dashed #90caf9;
    font-family: 'Nunito', sans-serif;
  }

  .popup-rules strong {
    color: #d32f2f;
    font-weight: 800;
  }

  .start-button {
    display: block;
    width: 100%;
    padding: 20px;
    font-size: 28px;
    font-weight: 900;
    color: white;
    background: linear-gradient(135deg, #4CAF50 0%, #45a049 100%);
    border: none;
    border-radius: 50px;
    cursor: pointer;
    box-shadow: 0 8px 25px rgba(76, 175, 80, 0.4);
    transition: all 0.3s;
    text-transform: uppercase;
    letter-spacing: 2px;
    font-family: 'Nunito', sans-serif;
  }

  .start-button:hover {
    transform: translateY(-3px);
    box-shadow: 0 12px 35px rgba(76, 175, 80, 0.6);
  }

  .start-button:active {
    transform: translateY(0);
  }

  @keyframes popIn {
    0% { 
      opacity: 0;
      transform: scale(0.5) rotate(-5deg);
    }
    100% { 
      opacity: 1;
      transform: scale(1) rotate(0deg);
    }
  }

  @keyframes bounce {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-10px); }
  }

  /* ==================== ИГРОВОЕ ПОЛЕ 3×6 ==================== */
  .board-wrapper {
    position: relative;
    width: 100%;
    max-width: 1500px;
    margin: 0 auto;
    padding-top: 20px;
  }

  .board {
    position: relative;
    width: 100%;
    height: 0;
    padding-bottom: 60%;
    max-height: 900px;
  }

  .board-inner {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
  }

  .cell-wrapper {
    position: absolute;
    display: flex;
    flex-direction: column;
    align-items: center;
    z-index: 5;
  }

  .cell {
    width: 220px;
    height: 220px;
    background: linear-gradient(135deg, #ffffff 0%, #f0f0f0 100%);
    border: 6px solid #fff;
    border-radius: 30px;
    overflow: hidden;
    box-shadow: 0 12px 35px rgba(0,0,0,0.3);
    transition: all 0.3s;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 15px;
    font-family: 'Nunito', sans-serif;
  }

  .cell:hover {
    transform: scale(1.05);
    box-shadow: 0 18px 45px rgba(0,0,0,0.4);
  }

  .cell.start {
    border-color: #4CAF50;
    box-shadow: 0 0 30px rgba(76,175,80,0.6);
    animation: glow 2s infinite;
  }

  .cell.finish {
    border-color: #FFD700;
    box-shadow: 0 0 30px rgba(255,215,0,0.6);
    animation: pulse 1.5s infinite;
  }

  .cell img.cell-image {
    width: 85%;
    height: 85%;
    object-fit: contain;
    border-radius: 12px;
  }

  .cell-number {
    position: absolute;
    top: 10px;
    left: 10px;
    background: rgba(255,255,255,0.95);
    padding: 5px 14px;
    border-radius: 14px;
    font-size: 20px;
    font-weight: 900;
    color: #333;
    z-index: 2;
    font-family: 'Nunito', sans-serif;
  }

  .cell-label {
    margin-top: 15px;
    color: white;
    font-size: 18px;
    font-weight: 800;
    text-align: center;
    text-shadow: 0 2px 6px rgba(0,0,0,0.6);
    font-family: 'Nunito', sans-serif;
    max-width: 220px;
    word-wrap: break-word;
    line-height: 1.2;
  }

  @keyframes glow {
    0%, 100% { box-shadow: 0 0 30px rgba(76,175,80,0.6); }
    50% { box-shadow: 0 0 60px rgba(76,175,80,0.9); }
  }

  @keyframes pulse {
    0%, 100% { 
      transform: scale(1); 
      box-shadow: 0 0 30px rgba(255,215,0,0.6); 
    }
    50% { 
      transform: scale(1.05); 
      box-shadow: 0 0 60px rgba(255,215,0,0.9); 
    }
  }

  .path-svg {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 1;
  }

  .path-line {
    fill: none;
    stroke: rgba(255,255,255,0.7);
    stroke-width: 12;
    stroke-linecap: round;
    stroke-dasharray: 20, 12;
    animation: dash 20s linear infinite;
  }

  @keyframes dash {
    to {
      stroke-dashoffset: -1000;
    }
  }

  /* Кот — крупный, ходит по верхнему краю картинок */
  .cat {
    position: fixed;
    width: 180px;
    height: 180px;
    z-index: 50;
    transition: all 0.7s cubic-bezier(0.68, -0.55, 0.265, 1.55);
    filter: drop-shadow(0 10px 20px rgba(0,0,0,0.5));
    pointer-events: none;
  }

  .cat img {
    width: 100%;
    height: 100%;
    object-fit: contain;
  }

  .cat.moving {
    animation: bounceMove 0.5s ease-in-out;
  }

  @keyframes bounceMove {
    0%, 100% { transform: translateY(0) scale(1) rotate(0deg); }
    25% { transform: translateY(-50px) scale(1.2) rotate(-8deg); }
    50% { transform: translateY(0) scale(1) rotate(0deg); }
    75% { transform: translateY(-25px) scale(1.1) rotate(8deg); }
  }

  /* 3D КУБИК — ПРЕЖНИЙ РАЗМЕР (80px) */
  .dice-container {
    position: fixed;
    top: 20px;
    right: 20px;
    width: 80px;
    height: 80px;
    perspective: 700px;
    cursor: pointer;
    z-index: 100;
  }

  .dice-container:hover {
    transform: scale(1.05);
  }

  .dice-container:active {
    transform: scale(0.95);
  }

  .dice {
    width: 100%;
    height: 100%;
    position: relative;
    transform-style: preserve-3d;
    transition: transform 1s ease-out;
  }

  .face {
    position: absolute;
    width: 80px;
    height: 80px;
    background: linear-gradient(135deg, #ffffff 0%, #e0e0e0 100%);
    border: 4px solid #2c3e50;
    border-radius: 15px;
    display: grid;
    padding: 14px;
    box-shadow: inset 0 0 25px rgba(0,0,0,0.1);
    backface-visibility: hidden;
  }

  .face-1 { transform: rotateY(0deg) translateZ(40px); }
  .face-6 { transform: rotateY(180deg) translateZ(40px); }
  .face-3 { transform: rotateY(90deg) translateZ(40px); }
  .face-4 { transform: rotateY(-90deg) translateZ(40px); }
  .face-2 { transform: rotateX(90deg) translateZ(40px); }
  .face-5 { transform: rotateX(-90deg) translateZ(40px); }

  .dot {
    width: 14px;
    height: 14px;
    background: linear-gradient(135deg, #e74c3c, #c0392b);
    border-radius: 50%;
    align-self: center;
    justify-self: center;
    box-shadow: 0 2px 6px rgba(0,0,0,0.3);
  }

  .face-1 { 
    display: flex; 
    align-items: center; 
    justify-content: center; 
  }
  .face-1 .dot { 
    width: 22px; 
    height: 22px; 
  }

  .face-2 { grid-template: 1fr 1fr / 1fr; gap: 8px; }
  .face-2 .dot:nth-child(1) { justify-self: end; align-self: start; }
  .face-2 .dot:nth-child(2) { justify-self: start; align-self: end; }

  .face-3 { grid-template: 1fr 1fr 1fr / 1fr; gap: 6px; }
  .face-3 .dot:nth-child(1) { justify-self: end; align-self: start; }
  .face-3 .dot:nth-child(2) { justify-self: center; align-self: center; }
  .face-3 .dot:nth-child(3) { justify-self: start; align-self: end; }

  .face-4 { grid-template: 1fr 1fr / 1fr 1fr; gap: 10px; }

  .face-5 { grid-template: 1fr 1fr 1fr / 1fr 1fr; gap: 8px; }
  .face-5 .dot:nth-child(5) { grid-column: 1 / 3; justify-self: center; }

  .face-6 { grid-template: 1fr 1fr 1fr / 1fr 1fr; gap: 9px; }

  .dice-value {
    position: fixed;
    top: 110px;
    right: 35px;
    background: rgba(255,255,255,0.95);
    width: 40px;
    height: 40px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    font-weight: 900;
    color: #e74c3c;
    box-shadow: 0 4px 15px rgba(0,0,0,0.3);
    z-index: 100;
    opacity: 0;
    transform: scale(0);
    transition: all 0.3s;
    font-family: 'Nunito', sans-serif;
  }

  .dice-value.show {
    opacity: 1;
    transform: scale(1);
    animation: popIn 0.3s cubic-bezier(0.68, -0.55, 0.265, 1.55);
  }

  .roll-hint {
    position: fixed;
    top: 160px;
    right: 25px;
    color: white;
    font-size: 12px;
    font-weight: 700;
    text-align: center;
    opacity: 0.9;
    text-shadow: 0 2px 4px rgba(0,0,0,0.5);
    animation: hintPulse 2s infinite;
    width: 60px;
    font-family: 'Nunito', sans-serif;
    z-index: 100;
  }

  @keyframes hintPulse {
    0%, 100% { opacity: 0.6; }
    50% { opacity: 1; }
  }

  .win-message {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.85);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 1000;
    flex-direction: column;
    backdrop-filter: blur(5px);
    font-family: 'Nunito', sans-serif;
  }

  .win-message.show {
    display: flex;
    animation: fadeIn 0.5s;
  }

  .win-message h1 {
    color: #FFD700;
    font-size: 80px;
    font-weight: 900;
    text-shadow: 0 0 30px rgba(255,215,0,0.8);
    margin-bottom: 20px;
    animation: celebrate 1s infinite;
    font-family: 'Nunito', sans-serif;
  }

  @keyframes celebrate {
    0%, 100% { transform: scale(1) rotate(0deg); }
